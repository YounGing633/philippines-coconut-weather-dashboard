name: Update Philippines Coconut Weather Dashboard

on:
  workflow_dispatch:
  schedule:
    # 00:20 UTC = 08:20 Beijing/Manila time
    - cron: "20 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: philippines-coconut-weather-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update data and build static site
        run: |
          python run_update.py --build-site --site-dir site --formats none --lookbacks 7,14,30,90 --forecast-days 16

      - name: Commit refreshed data back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history site/data site/index.html site/.nojekyll || true
          git diff --cached --quiet || git commit -m "Update Philippines coconut weather dashboard data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
